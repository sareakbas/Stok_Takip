<p-toast position="top-right"></p-toast>
<div class="login-page">
    <div class="login-card">
  
      <div class="login-visual">
        <div class="orange-shape"></div>
  
        <div class="brand-badge">
          <i class="pi pi-box"></i>
        </div>
  
        <div class="visual-content">
          <span class="visual-label">ERP</span>
          <h2>Stoklarınızı kolayca yönetin</h2>
          <p>Ürün, stok ve hareket takibini tek panelden kontrol edin.</p>
        </div>
      </div>
  
      <div class="login-form-area">
        <div class="form-heading">
          <span class="form-tag">Giriş</span>
          <h1>ERP Stok Paneli</h1>
          <p>Devam etmek için hesabınıza giriş yapın.</p>
        </div>
  
        <div class="form-group">
          <label for="Email">E-posta</label>
  
          <span class="input-wrapper">
            <i class="pi pi-envelope"></i>
  
            <input
              pInputText
              id="Email"
              type="email"
              [(ngModel)]="loginRequest.email"
              placeholder="E-posta adresinizi girin"
              autocomplete="email"
            />
          </span>
        </div>
  
        <div class="form-group">
          <label for="password">Şifre</label>
  
          <p-password
            inputId="password"
            [(ngModel)]="loginRequest.password"
            [toggleMask]="true"
            [feedback]="false"
            placeholder="Şifrenizi girin"
            styleClass="password-field"
            autocomplete="current-password"
          >
          </p-password>
        </div>
  
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" />
            <span>Beni hatırla</span>
          </label>
  
          <button type="button" class="forgot-password">
            Şifremi unuttum
          </button>
        </div>
  
        <p-button
          label="Giriş Yap"
          icon="pi pi-sign-in"
          (onClick)="login()"
          styleClass="login-button"
        >
        </p-button>
      </div>

      <div class="register-link">
        <span>Hesabınız yok mu?</span>
        <a routerLink="/register">Kayıt olun</a>
      </div>
  
    </div>
  </div>
